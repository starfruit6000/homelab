[unix_http_server]
file=/home/vscode/.local/state/homelab/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/home/vscode/.local/state/homelab/supervisord.log
pidfile=/home/vscode/.local/state/homelab/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/vscode/.local/state/homelab/supervisor.sock

[program:dogs]
command=/nix/var/nix/profiles/default/bin/nix run --no-write-lock-file "path:%(ENV_HOMELAB_WORKSPACE)s/nixos#dogs-vm"
directory=%(ENV_HOMELAB_WORKSPACE)s
environment=HOME="/home/vscode",NIX_DISK_IMAGE="/home/vscode/.local/state/homelab/dogs/disk.qcow2",QEMU_OPTS="-virtfs local,path=/home/vscode/.local/state/homelab/dogs/exchange,security_model=none,mount_tag=exchange"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/home/vscode/.local/state/homelab/dogs/console.log
redirect_stderr=true

[program:echoes]
command=/nix/var/nix/profiles/default/bin/nix run --no-write-lock-file "path:%(ENV_HOMELAB_WORKSPACE)s/nixos#echoes-vm"
directory=%(ENV_HOMELAB_WORKSPACE)s
environment=HOME="/home/vscode",NIX_DISK_IMAGE="/home/vscode/.local/state/homelab/echoes/disk.qcow2",QEMU_OPTS="-virtfs local,path=/home/vscode/.local/state/homelab/echoes/exchange,security_model=none,mount_tag=exchange"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/home/vscode/.local/state/homelab/echoes/console.log
redirect_stderr=true
