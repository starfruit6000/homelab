apiVersion: apps/v1
kind: Deployment
metadata:
  name: copyparty
  labels:
    app: copyparty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: copyparty
  template:
    metadata:
      labels:
        app: copyparty
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: copyparty
          image: docker.io/copyparty/dj:1.20.26@sha256:c8b279b62e7e05d99d1ac7acac3876ebea90c54b16ca3e2b966e7381fc53b6f9
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3923
              name: http
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /cfg
            - name: copyparty-configmap
              mountPath: /cfg/copyparty.conf
              subPath: copyparty.conf
            - name: data
              mountPath: /w

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: copyparty-configmap
          configMap:
            name: copyparty-configmap
