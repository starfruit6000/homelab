apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
  values:
    txtOwnerId: ${CLUSTER_NAME}
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-key
            key: apiKey
    sources:
      - gateway-httproute
      - gateway-tcproute
      - gateway-udproute
      - service
    domainFilters:
      - parents-basement.win
