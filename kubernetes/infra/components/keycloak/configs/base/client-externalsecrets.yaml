apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: centralized-oidc-secret
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: envoy-oidc
  target:
    template:
      metadata:
        labels:
          operator.keycloak.org/kind: KeycloakOIDCClient
  data:
    - secretKey: client-secret
      remoteRef:
        key: centralized-oidc-secret
        property: client-secret
---
# Reuse the permanent master-realm service account managed by OpenTofu.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: keycloak-admin-source
  data:
    - secretKey: client-id
      remoteRef:
        key: terraform
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: terraform
        property: client-secret
