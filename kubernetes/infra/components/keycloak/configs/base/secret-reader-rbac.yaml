apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-secret-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-secret-reader
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [terraform]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-secret-reader
subjects:
  - kind: ServiceAccount
    name: keycloak-secret-reader
    namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keycloak-secret-reader-review
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews, selfsubjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keycloak-secret-reader-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: keycloak-secret-reader-review
subjects:
  - kind: ServiceAccount
    name: keycloak-secret-reader
    namespace: keycloak
