apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: envoy-oidc
spec:
  provider:
    kubernetes:
      remoteNamespace: envoy-gateway-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: keycloak-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: keycloak-admin-source
spec:
  provider:
    kubernetes:
      remoteNamespace: keycloak
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: keycloak-secret-reader
