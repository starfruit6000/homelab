apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-secret-reader
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [centralized-oidc-secret]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-secret-reader
subjects:
  - kind: ServiceAccount
    name: keycloak-secret-reader
    namespace: keycloak
