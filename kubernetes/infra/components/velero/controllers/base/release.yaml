apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
spec:
  interval: 1h
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  chart:
    spec:
      chart: velero
      version: "12.2.0"
      sourceRef:
        kind: HelmRepository
        name: velero
  values:
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    credentials:
      useSecret: true
      existingSecret: velero-s3-credentials
    configuration:
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: velero-backups
          credential:
            name: velero-s3-credentials
            key: cloud
          config:
            objectLockEnabled: true
            region: default
            s3ForcePathStyle: true
            s3Url: http://seaweed-s3.seaweedfs-operator.svc.cluster.local:8333
      volumeSnapshotLocation: []
      features: EnableCSI
