apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed
spec:
  image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
  master:
    replicas: 1
    volumeSizeLimitMB: 1024
  #    persistence:
  #      enabled: true
  #      resources:
  #        requests:
  #          storage: "1Gi"
  volume:
    replicas: 1
    requests:
      storage: 2Ti
  filer:
    replicas: 1
    persistence:
      enabled: true
      resources:
        requests:
          storage: "1Gi"
  s3:
    replicas: 1
