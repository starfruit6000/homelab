apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed
spec:
  image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
  master:
    replicas: 1
    volumeSizeLimitMB: 1024
  #    persistence:
  #      enabled: true
  #      resources:
  #        requests:
  #          storage: "1Gi"
