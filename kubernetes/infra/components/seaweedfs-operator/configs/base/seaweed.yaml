apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed
spec:
  image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
  master:
    replicas: 1
    volumeSizeLimitMB: 1024
  #    persistence:
  #      enabled: true
  #      resources:
  #        requests:
  #          storage: "1Gi"
  volume:
    replicas: 1
    requests:
      storage: 2Ti
  filer:
    replicas: 1
    persistence:
      enabled: true
      resources:
        requests:
          storage: "1Gi"
  s3:
    replicas: 1
