apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed
spec:
  image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
  master:
    replicas: 1
    volumeSizeLimitMB: 1024
  #    persistence:
  #      enabled: true
  #      resources:
