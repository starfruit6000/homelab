creation_rules:
  # private keys for use by flux for decrypting cluster specific files
  - path_regex: sops/.*/flux-secret\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - *masterkey
          - *admin

  # kube_config files
  - path_regex: sops/.*/kube_config\.enc$
    key_groups:
      - age:
          - *ansible
          - *masterkey
          - *admin

  # global secrets
  - path_regex: kubernetes/.*/base/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - *ansible
          - *masterkey
          - *admin
          - *meddle
          - *meddle-local
          - *animals
          - *animals-local

  # ansible vars
  - path_regex: sops/ansible-secrets/secrets.enc.yaml$
    key_groups:
      - age:
          - *ansible
          - *masterkey
          - *admin

  # opentofu secrets
  - path_regex: sops/opentofu-secrets/.*enc.*
    key_groups:
      - age:
          - *masterkey
          - *admin

  # shared prod encrypted files
  - path_regex: kubernetes/.*/prod/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - *ansible
          - *masterkey
          - *admin
          - *meddle
          - *animals

  # shared local encrypted files
  - path_regex: kubernetes/.*/local/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - *ansible
          - *masterkey
          - *admin
          - *meddle-local
          - *animals-local

  # meddle encrypted files
  - path_regex: sops/meddle/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - *ansible
          - *masterkey
          - *admin
          - *meddle
  - path_regex: kubernetes/.*/meddle/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - *ansible
          - *masterkey
          - *admin
          - *meddle

  # meddle-local encrypted files
  - path_regex: sops/meddle-local/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - *ansible
          - *masterkey
          - *admin
          - *meddle-local
  - path_regex: kubernetes/.*/meddle-local/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - *ansible
          - *masterkey
          - *admin
          - *meddle-local

  # animals encrypted files
  - path_regex: sops/animals/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - *ansible
          - *masterkey
          - *admin
          - *animals
  - path_regex: kubernetes/.*/animals/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - *ansible
          - *masterkey
          - *admin
          - *animals

  # animals-local encrypted files
  - path_regex: sops/animals-local/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - *ansible
          - *masterkey
          - *admin
          - *animals-local
  - path_regex: kubernetes/.*/animals-local/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - *ansible
          - *masterkey
          - *admin
          - *animals-local
