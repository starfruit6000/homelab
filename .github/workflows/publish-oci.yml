name: push-artifact

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - '*'
    paths:
      - kubernetes/**

jobs:
  flux-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          # d2-fleet
          - artifact: fleet
            path: kubernetes/fleet
          # d2-infra
          - artifact: infra/cert-manager
            path: kubernetes/infra/components/cert-manager
          - artifact: infra/openebs
            path: kubernetes/infra/components/openebs
          - artifact: infra/seaweedfs-operator
            path: kubernetes/infra/components/seaweedfs-operator
          - artifact: infra/velero
            path: kubernetes/infra/components/velero
          - artifact: infra/envoy-gateway-system
            path: kubernetes/infra/components/envoy-gateway-system
          - artifact: infra/cnpg-system
            path: kubernetes/infra/components/cnpg-system
          - artifact: infra/external-dns
            path: kubernetes/infra/components/external-dns
          - artifact: infra/external-secrets
            path: kubernetes/infra/components/external-secrets
          - artifact: infra/keycloak
            path: kubernetes/infra/components/keycloak
          - artifact: infra/alloy
            path: kubernetes/infra/components/alloy
          - artifact: infra/node-feature-discovery
            path: kubernetes/infra/components/node-feature-discovery
          - artifact: infra/inteldeviceplugins-system
            path: kubernetes/infra/components/inteldeviceplugins-system
          - artifact: infra/rbac
            path: kubernetes/infra/components/rbac
          # d2-apps
          - artifact: apps/arr
            path: kubernetes/apps/components/arr
          - artifact: apps/seerr
            path: kubernetes/apps/components/seerr
          - artifact: apps/redmanager
            path: kubernetes/apps/components/redmanager
          - artifact: apps/copyparty
            path: kubernetes/apps/components/copyparty
          - artifact: apps/s3
            path: kubernetes/apps/components/s3
          - artifact: apps/nfsserver
            path: kubernetes/apps/components/nfsserver
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install flux
        uses: controlplaneio-fluxcd/distribution/actions/setup@d920cf0e370aebd3585a587e028b3a72c3e3bd9f # main
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare tags
        id: prep
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          TAG=latest
          VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA::8}"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=latest-stable
            VERSION="$GITHUB_REF_NAME"
          fi
          repository="${GITHUB_REPOSITORY,,}"
          echo "repository=ghcr.io/${repository}/${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Push artifact
        id: push
        uses: controlplaneio-fluxcd/distribution/actions/push@d920cf0e370aebd3585a587e028b3a72c3e3bd9f # main
        with:
          repository: ${{ steps.prep.outputs.repository }}
          path: ${{ matrix.path }}
          diff-tag: ${{ steps.prep.outputs.tag }}
          tags: ${{ steps.prep.outputs.version }}
      - name: Sign artifact
        if: steps.push.outputs.pushed == 'true'
        run: cosign sign --yes "$DIGEST_URL"
        env:
          DIGEST_URL: ${{ steps.push.outputs.digest-url }}
