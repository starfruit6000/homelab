---
- name: Run the equivalent of "apt-get update" as a separate step
  ansible.builtin.apt:
    update_cache: true

- name: Ensure zfs packages are installed
  ansible.builtin.apt:
    name:
      - dpkg-dev
      - linux-headers-generic
      - linux-image-generic
      - zfs-dkms
      - zfsutils-linux
      - mbuffer
      - jq
    state: present

- name: Safely load ZFS kernel module
  block:
    - name: Try loading ZFS kernel module
      community.general.modprobe:
        name: zfs
        state: present
  rescue:
    - name: Reboot
      ansible.builtin.reboot:
        msg: "Rebooting to apply kernel updates before loading ZFS"
        reboot_timeout: 600

    - name: Retry loading ZFS kernel module after reboot
      community.general.modprobe:
        name: zfs
        state: present

- name: Ensure keyfile file exists
  ansible.builtin.copy:
    dest: "{{ zfs_zpool_keyfile_path }}"
    content: "{{ zfs_zpool_keyfile_contents | trim }}"
    owner: root
    group: root
    mode: "0400"

- name: Create zfs-load-key systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/zfs-load-key.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Load encryption keys
      DefaultDependencies=no
      After=zfs-import.target
      Before=zfs-mount.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/zfs load-key -a

      [Install]
      RequiredBy=zfs-mount.service

- name: Enable zfs-load-key systemd service
  ansible.builtin.systemd:
    name: zfs-load-key.service
    enabled: true
    daemon_reload: true

- name: Check for available exported zpools
  ansible.builtin.command: zpool import
  register: available_exported_pools
  changed_when: false
  failed_when: false

- name: "Import existing {{ zfs_zpool }} zpool if not imported yet"
  ansible.builtin.command: "zpool import -f {{ zfs_zpool }}"
  when: "zfs_zpool in available_exported_pools.stdout"
  changed_when: true

- name: "Check if zpool '{{ zfs_zpool }}' already exists"
  ansible.builtin.command: "zpool status {{ zfs_zpool }}"
  register: zpool_status
  failed_when: false
  changed_when: false

- name: "Setup {{ zfs_zpool }} zpool"
  when: zpool_status.rc != 0
  block:
    - name: Create zpool
      community.general.zpool:
        name: "{{ zfs_zpool }}"
        state: present
        pool_properties:
          ashift: 12
        filesystem_properties:
          compression: lz4
          encryption: aes-256-gcm
          keyformat: passphrase
          keylocation: "file:///root/{{ zfs_zpool }}_keyfile"
        vdevs:
          - type: raidz2
            disks: "{{ zfs_zpool_physical_disks }}"
      register: this_sometimes_fails
  rescue:
    - name: Zpool creation debug
      ansible.builtin.debug:
        msg: "The task failed with this error: {{ this_sometimes_fails.stderr }}"

    - name: Manual intervention required
      ansible.builtin.pause:
        prompt: "Press ENTER to dismiss the error and continue. Press Ctrl+C and then 'A' to abort"

- name: Get mounted ZFS filesystems
  ansible.builtin.command: zfs mount
  changed_when: false
  register: zfs_mounted_filesystems

- name: "Load key zpool {{ zfs_zpool }} key"
  ansible.builtin.systemd:
    name: zfs-load-key.service
    state: restarted
  when: "zfs_zpool not in zfs_mounted_filesystems.stdout"

- name: Try to mount zpool
  ansible.builtin.systemd:
    name: zfs-mount.service
    state: restarted
  when: "zfs_zpool not in zfs_mounted_filesystems.stdout"

- name: "Enable monthly ZFS scrub timer for '{{ zfs_zpool }}'"
  ansible.builtin.systemd:
    name: "zfs-scrub-monthly@{{ zfs_zpool }}.timer"
    enabled: true
    state: started

- name: Ensure ZFS dataset tree exists
  community.general.zfs:
    name: "{{ item }}"
    state: present
  loop: "{{ zfs_dataset_tree }}"

- name: Import smartctl tasks
  ansible.builtin.import_tasks: smart.yaml

- name: Import k8s_zfs_tags tasks
  ansible.builtin.import_tasks: k8s_zfs_tags.yaml

- name: Import sanoid role
  ansible.builtin.import_role:
    name: geerlingguy.sanoid

- name: Import Primary cluster tasks
  ansible.builtin.import_tasks: primary.yaml
  when: zfs_host_type == 'primary'

- name: Import Secondary cluster tasks
  ansible.builtin.import_tasks: secondary.yaml
  when: zfs_host_type == 'secondary'

- name: Download import-zfs-localpv binary from GitLab
  ansible.builtin.get_url:
    url: "https://gitlab.com/starfruit6000/import-zfs-localpv/-/releases/{{ binary_version }}/downloads/import-zfs-localpv"
    dest: "/usr/local/bin/import-zfs-localpv"
    owner: "root"
    group: "root"
    mode: '0755'
  vars:
    binary_version: "1.0.4"
